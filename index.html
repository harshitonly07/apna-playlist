<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Introvert Boy | Emotional 3D Radio</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #050608;
            --blue-smoke: #1d4ed8;
            --red-smoke: #e11d48;
            --card-surface: rgba(13, 15, 22, 0.72);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {

    background: 
        linear-gradient(rgba(5, 6, 8, 0.65), rgba(5, 6, 8, 0.75)),
        url('https://i.pinimg.com/1200x/af/7c/52/af7c52a64607f9ed0b1b58a4f4b370d3.jpg') no-repeat center center fixed;
    background-size: cover;
    color: var(--text-main);
    font-family: 'Quicksand', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
    perspective: 1200px;
}

        /* 3D Smoke Canvas */
        #smokeCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            pointer-events: none;
            filter:blur(40px);
            opacity:0.6;
            
        }

        /* Background Vignette */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, transparent 30%, rgba(5, 6, 8, 0.85) 90%);
            z-index: 2;
            pointer-events: none;
        }

        /* Layout Container: Player Left + Playlist Right */
        .card-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            max-width: 900px;
            width: 92%;
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out;
        }

        /* Main Music Card (Left) */
        .main-card {
            flex: 1.15;
            background: var(--card-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 34px 26px;
            text-align: center;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transform: translateZ(40px);
        }

        .header h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.85rem;
            letter-spacing: 4px;
            margin-bottom: 4px;
            background: linear-gradient(135deg, #ffffff 40%, #94a3b8);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 0.75rem;
            color: var(--text-dim);
            letter-spacing: 1.5px;
            line-height: 1.3;
        }

        /* Visualizer */
        .visualizer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            height: 65px;
            margin: 20px 0 12px;
        }

        .bar {
            width: 4px;
            height: 12px;
            background: linear-gradient(to top, var(--blue-smoke), var(--red-smoke));
            border-radius: 8px;
            transition: height 0.1s ease;
            box-shadow: 0 0 12px rgba(225, 29, 72, 0.4);
        }

        .bar.animate {
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        @keyframes bounce {
            0% { height: 12px; }
            100% { height: 55px; }
        }

        .track-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 0.82rem;
            color: var(--text-dim);
            margin-bottom: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Quote Box */
        .quote-box {
            font-style: italic;
            font-size: 0.82rem;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            padding: 12px;
            margin-bottom: 18px;
            min-height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1.4;
        }

        /* Seek Bar / Progress Line Styling */
        .progress-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            width: 100%;
        }

        .time-text {
            font-size: 0.72rem;
            color: var(--text-dim);
            min-width: 34px;
        }

        .progress-bar {
            flex-grow: 1;
           -webkit-appearance: none;
           appearance: none;
            height: 4px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.15);
            outline: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #e11d48;
            box-shadow: 0 0 10px #e11d48;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        /* Controls */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: 20px;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: scale(1.08);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 15px rgba(29, 78, 216, 0.4);
        }

        .btn-play {
            width: 58px;
            height: 58px;
            background: linear-gradient(135deg, var(--red-smoke), var(--blue-smoke));
            border: none;
            box-shadow: 0 0 25px rgba(225, 29, 72, 0.45);
        }

        .btn-play:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(29, 78, 216, 0.7);
        }

        /* Ambient Controls */
        .ambient-footer {
            border-top: 1px solid var(--border);
            padding-top: 16px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid var(--border);
            padding: 8px 14px;
            border-radius: 20px;
            color: var(--text-dim);
            font-size: 0.75rem;
            cursor: pointer;
            transition: 0.25s;
        }

        .toggle-btn.active {
            background: rgba(225, 29, 72, 0.15);
            color: #fda4af;
            border-color: var(--red-smoke);
            box-shadow: 0 0 12px rgba(225, 29, 72, 0.3);
        }

        /* Right Side Playlist Container */
        .playlist-card {
            flex: 0.85;
            height: 490px;
            background: var(--card-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
            transform: translateZ(30px);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.7),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .playlist-header h2 {
            font-family: 'Cinzel', serif;
            font-size: 1.05rem;
            letter-spacing: 2px;
            color: #f1f5f9;
        }

        .playlist-header span {
            font-size: 0.72rem;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 3px 8px;
            border-radius: 12px;
        }

        .playlist-items {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
        }

        .playlist-items::-webkit-scrollbar {
            width: 4px;
        }
        .playlist-items::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.08);
            transform: translateX(3px);
        }

        .track-item.active {
            background: linear-gradient(90deg, rgba(29, 78, 216, 0.25), rgba(225, 29, 72, 0.25));
            border-color: rgba(225, 29, 72, 0.4);
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.2);
        }

        .track-details {
            text-align: left;
            max-width: 82%;
        }

        .track-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-sub {
            font-size: 0.7rem;
            color: var(--text-dim);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-icon {
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        .track-item.active .track-icon {
            color: #f43f5e;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.3); }
        }

        /* Mobile Layout */
        @media (max-width: 820px) {
            body {
                overflow-y: auto;
                padding: 40px 0;
            }
            .card-wrapper {
                flex-direction: column;
                transform: none !important;
            }
            .main-card, .playlist-card {
                width: 100%;
                transform: none !important;
            }
            .playlist-card {
                height: 340px;
            }
        }
    </style>
</head>
<body>

    <canvas id="smokeCanvas"></canvas>
    <div class="vignette"></div>

    <div class="card-wrapper" id="cardWrapper">
        <!-- Left Main Card -->
        <div class="main-card">
            <div class="header">
                <h1>INTROVERT HU NA</h1>
                <p>Somewhere between his thoughts and reality, he finds his own universe.</p>
            </div>

            <div class="visualizer" id="visualizer">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>

            <div class="track-title" id="title">Raaz Aankhei Teri</div>
            <div class="track-artist" id="artist">Arijit Singh</div>

            <div class="quote-box" id="quote">
                "Some thoughts only breathe in the deep of midnight."
            </div>

            <!-- Seek Bar / Progress Line -->
            <div class="progress-box">
                <span id="currentTime" class="time-text">0:00</span>
                <input type="range" id="progressBar" value="0" min="0" max="100" class="progress-bar">
                <span id="totalDuration" class="time-text">0:00</span>
            </div>

            <!-- Player Controls -->
            <div class="controls">
                <button class="btn" onclick="prevTrack()">⏮</button>
                <button class="btn btn-play" id="playBtn" onclick="togglePlay()">▶</button>
                <button class="btn" onclick="nextTrack()">⏭</button>
            </div>

            <div class="ambient-footer">
                <button class="toggle-btn" id="rainBtn" onclick="toggleRain()">🌧️ Midnight Rain</button>
                <button class="toggle-btn" onclick="newQuote()">💭 Switch Mood</button>
            </div>
        </div>

        <!-- Right Playlist Card -->
        <div class="playlist-card">
            <div class="playlist-header">
                <h2>PLAYLIST</h2>
                <span id="trackCount">0 songs</span>
            </div>
            <ul class="playlist-items" id="playlistContainer"></ul>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="player"></audio>
    <audio id="rain" loop src="https://cdn.pixabay.com/download/audio/2022/05/16/audio_db6591201e.mp3?filename=soft-rain-ambient-111154.mp3"></audio>

    <script>
        /* --- 3D INTERACTIVE TILT EFFECT --- */
        const card = document.getElementById('cardWrapper');
        window.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 820) {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 35;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 35;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            }
        });

        /* --- RED & BLUE DUAL SMOKE ENGINE --- */
        const canvas = document.getElementById('smokeCanvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = canvas.height + Math.random() * 100;
                this.radius = Math.random() * 140 + 80;
                this.vy = -(Math.random() * 0.7 + 0.3);
                this.vx = (Math.random() - 0.5) * 0.6;
                this.alpha = 0.01;
                this.maxAlpha = Math.random() * 0.35 + 0.15;
                this.type = Math.random() > 0.5 ? 'red' : 'blue';
            }

            update() {
                this.y += this.vy;
                this.x += this.vx;

                if (this.y < canvas.height * 0.6) {
                    this.alpha -= 0.002;
                } else if (this.alpha < this.maxAlpha) {
                    this.alpha += 0.003;
                }

                if (this.y < -this.radius || this.alpha <= 0) {
                    this.reset();
                }
            }

            draw() {
                const gradient = ctx.createRadialGradient(
                    this.x, this.y, 0,
                    this.x, this.y, this.radius
                );

                if (this.type === 'red') {
                    gradient.addColorStop(0, `rgba(225, 29, 72, ${this.alpha})`);
                    gradient.addColorStop(1, 'rgba(225, 29, 72, 0)');
                } else {
                    gradient.addColorStop(0, `rgba(29, 78, 216, ${this.alpha})`);
                    gradient.addColorStop(1, 'rgba(29, 78, 216, 0)');
                }

                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 35 }, () => new Particle());

        function animateSmoke() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animateSmoke);
        }
        animateSmoke();

        /* --- PLAYLIST & AUDIO LOGIC --- */
        const playlist = [
            { title: "Raaz Aankhei Teri", artist: "Arijit singh", src: "song.song/razz.mp3" },
            { title: "Jhoot", artist: "Harmeet", src: "song.song/jhoot.mp3" },
            { title: "I Met Her Again", artist: "Maan Panu & tav", src: "song.song/met-her.mp3" },
            { title: "The Last Letter", artist: "Maan Panu & Mazaak", src: "song.song/The Last Letter.mp3" },
            { title: "Tu Hai Jahan", artist: "Maan Panu", src: "song.song/Tu Hai Jahan.mp3" },
            { title: "Phool", artist: "AUR", src: "song.song/Phool.mp3" },
            { title: "Tu Hai Kaha", artist: "AUR", src: "song.song/Tu Hai Kahan.mp3" },
            { title: "Long Way from Home", artist: "MC SQUARE | Radhika Bhide", src: "song.song/Long Way from Home.mp3" },
            { title: "Mat Jao", artist: "AUR",src:"song.song/Mat Jao.mp3"},
            { title: "Tum Se", artist: "AUR",src:"song.song/Tum Se.mp3"},
            { title: "Na Ho Tum", artist: "Kalp",src:"song.song/Na Ho Tum.mp3"},
            { title: "O RE BEWAFA", artist: "ASAD NAEEM ",src:"song.song/O RE BEWAFA.mp3"},
            { title: "Mohobbat Tab Kro", artist: "AASHMAN",src:"song.song/Mohobbat Tab Kro.mp3"},
            { title: "TUMARI TASVEEREN", artist: "KALAM INK | CHERISH BANHOTRA | GREYY.BASS ",src:"song.song/TUMARI.mp3"},
            { title: "RANGREZA ", artist: "The UK07 Rider X KhanZaadi ",src:"song.song/RANGREZA.mp3"},
            { title: "PAR AB JO AAYEGI TU ", artist: "AUR",src:"song.song/AUR - PAR AB JO AAYEGI TU.mp3"},
            { title: "Mile Jo Sukoon ", artist: "Mile Jo Sukoon|Aarzu EP ",src:"song.song/Khosl Mile Jo Sukoon.mp3"},
            { title: "Jaane Do Humein ", artist: "Rishabh Vyas",src:"song.song/Jaane Do Humein.mp3"},
            { title: "Alfaaz", artist: "Hamza Malik x Zain Zohaib ",src:"song.song/Alfaaz.mp3"},
            { title: "Jiyara (Hamesha Tera Sath Nibhaunga)", artist: " Kushagra | Vanshika ",src:"song.song/Jiyara.mp3"},
            { title: " Tu Hi Tu ", artist: "Red Box Music",src:"song.song/Tu Hi Tu.mp3"},



        ];

        const thoughts = [
            "Silence speaks the loudest when the world falls asleep.",
            "Red warmth in the heart, blue cold in the world.",
            "Kuch baatein lafzon se nahi, bas iss khamoshi se bayaan hoti hain.",
            "You don't hate the crowd, you just love your own peace.",
            "Lost somewhere between who I was and who I want to be."
        ];

        let index = 0;
        let isPlaying = false;
        let rainOn = false;

        const player = document.getElementById('player');
        const rain = document.getElementById('rain');
        const playBtn = document.getElementById('playBtn');
        const title = document.getElementById('title');
        const artist = document.getElementById('artist');
        const quote = document.getElementById('quote');
        const rainBtn = document.getElementById('rainBtn');
        const bars = document.querySelectorAll('.visualizer .bar');
        const playlistContainer = document.getElementById('playlistContainer');
        const trackCount = document.getElementById('trackCount');
        const progressBar = document.getElementById('progressBar');
        const currentTimeElem = document.getElementById('currentTime');
        const totalDurationElem = document.getElementById('totalDuration');

        // Seconds ko MM:SS me convert karne ke liye
        function formatTime(seconds) {
            if (isNaN(seconds) || seconds === Infinity) return "0:00";
            const min = Math.floor(seconds / 60);
            const sec = Math.floor(seconds % 60);
            return `${min}:${sec < 10 ? '0' : ''}${sec}`;
        }

        // Render Playlist List
        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            trackCount.textContent = `${playlist.length} songs`;

            playlist.forEach((song, i) => {
                const li = document.createElement('li');
                li.className = `track-item ${i === index ? 'active' : ''}`;
                li.onclick = () => selectTrack(i);

                li.innerHTML = `
                    <div class="track-details">
                        <div class="track-name">${song.title}</div>
                        <div class="track-sub">${song.artist}</div>
                    </div>
                    <div class="track-icon">${i === index ? '♫' : '▶'}</div>
                `;
                playlistContainer.appendChild(li);
            });
        }

        function loadTrack(i) {
            index = i;
            player.src = playlist[index].src;
            title.textContent = playlist[index].title;
            artist.textContent = playlist[index].artist;
            progressBar.value = 0;
            currentTimeElem.textContent = "0:00";
            totalDurationElem.textContent = "0:00";
            renderPlaylist();
        }

        function togglePlay() {
            if (isPlaying) {
                player.pause();
                playBtn.textContent = '▶';
                bars.forEach(bar => {
                    bar.classList.remove('animate');
                    bar.style.height = '12px';
                });
            } else {
                player.play();
                playBtn.textContent = '⏸';
                bars.forEach((bar, i) => {
                    bar.classList.add('animate');
                    bar.style.animationDelay = `${i * 0.15}s`;
                });
            }
            isPlaying = !isPlaying;
            renderPlaylist();
        }

        function selectTrack(i) {
            loadTrack(i);
            isPlaying = false;
            togglePlay();
        }

        function nextTrack() {
            index = (index + 1) % playlist.length;
            loadTrack(index);
            if (isPlaying) player.play();
        }

        function prevTrack() {
            index = (index - 1 + playlist.length) % playlist.length;
            loadTrack(index);
            if (isPlaying) player.play();
        }

        function toggleRain() {
            if (rainOn) {
                rain.pause();
                rainBtn.classList.remove('active');
            } else {
                rain.volume = 0.35;
                rain.play();
                rainBtn.classList.add('active');
            }
            rainOn = !rainOn;
        }

        function newQuote() {
            quote.textContent = thoughts[Math.floor(Math.random() * thoughts.length)];
        }

        /* --- SEEK BAR UPDATES --- */
        player.addEventListener('timeupdate', () => {
            if (player.duration) {
                const progressPercent = (player.currentTime / player.duration) * 100;
                progressBar.value = progressPercent;
                currentTimeElem.textContent = formatTime(player.currentTime);
                totalDurationElem.textContent = formatTime(player.duration);
            }
        });

        player.addEventListener('loadedmetadata', () => {
            totalDurationElem.textContent = formatTime(player.duration);
        });

        progressBar.addEventListener('input', () => {
            if (player.duration) {
                const seekTime = (progressBar.value / 100) * player.duration;
                player.currentTime = seekTime;
            }
        });

        player.addEventListener('ended', nextTrack);

        // First Load
        loadTrack(0);
    </script>
</body>
</html>
